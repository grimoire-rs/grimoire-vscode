name: Release

# Publishing is INERT until the relevant identity/secrets are configured:
#   - VS Code Marketplace → Microsoft Entra (federated OIDC, no PAT). Requires
#     repo secrets AZURE_CLIENT_ID + AZURE_TENANT_ID for an Entra app
#     registration whose GitHub federated credential trusts
#     subject `repo:grimoire-rs/grimoire-vscode:environment:release`, and which
#     is added as a member of the `grimoire-rs` Marketplace publisher.
#   - Open VSX → OVSX_PAT secret.
# Without them, the workflow still builds, tests, packages, and attaches the
# .vsix to a GitHub Release; the marketplace publish steps are skipped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release / attach the .vsix
  id-token: write # mint the OIDC token for Entra federated auth

jobs:
  release:
    runs-on: ubuntu-latest
    # The `release` environment fixes the OIDC subject to
    # `repo:grimoire-rs/grimoire-vscode:environment:release` so it matches the
    # Entra app's federated credential.
    environment: release
    # Job-level env so the secret-gating `if:` on the publish steps can read it.
    # (A step's own `env:` block is not visible to that step's `if:` condition.)
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # git-cliff needs full history + tags to build notes

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify (lint + types + build)
        run: npm run check

      - name: Test (headless)
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package

      - name: Generate release notes (git-cliff)
        id: release_notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: '*.vsix'
          body: ${{ steps.release_notes.outputs.content }}

      - name: Azure login (Entra federated)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        if: env.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath *.vsix --azure-credential

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix --pat "$OVSX_PAT"
